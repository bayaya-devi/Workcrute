<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Tableau de bord Workcrute</title>
    <link rel="stylesheet" href="../../admin-system.css">
  </head>
  <body class="admin-body" data-admin-page="dashboard">
    <template data-admin-content>
      <header class="adm-head">
        <div><span class="adm-kicker" data-v2-dashboard="kicker">Pilotage opérationnel</span><h1 data-v2-dashboard="title">Tableau de bord</h1><p data-v2-dashboard="subtitle">Vue réelle des dossiers, des employés et des congés.</p></div>
        <button class="adm-button secondary" type="button" data-v2-refresh data-v2-dashboard="refresh">Actualiser</button>
      </header>
      <div class="adm-v2-stats" data-v2-dashboard-stats aria-live="polite" aria-busy="true"></div>
      <div class="adm-v2-dashboard-grid">
        <section class="adm-card adm-v2-dashboard-panel" aria-labelledby="recent-applicants-title"><div class="adm-section-head"><div><h2 id="recent-applicants-title" data-v2-dashboard="recentApplicants">Derniers postulants</h2><p data-v2-dashboard="recentHelp">Dossiers déposés récemment.</p></div><a class="adm-button secondary" href="/admin/postulants/" data-v2-dashboard="viewAll">Tout voir</a></div><div data-v2-recent-applicants aria-live="polite"></div></section>
        <section class="adm-card adm-v2-dashboard-panel" aria-labelledby="leave-title"><div class="adm-section-head"><div><h2 id="leave-title" data-v2-dashboard="leave">Congés à traiter</h2><p data-v2-dashboard="leaveHelp">Demandes en attente de décision.</p></div><a class="adm-button secondary" href="/admin/conges/" data-v2-dashboard="manage">Gérer</a></div><div data-v2-pending-leave aria-live="polite"></div></section>
      </div>
      <div class="adm-error" data-v2-dashboard-error role="alert" hidden></div>
    </template>
    <script src="../../admin-layout.js"></script>
    <script src="../../admin-i18n.js"></script>
    <script src="../../admin-control-center.js"></script>
    <script src="../../admin-v2-dashboard.js"></script>
  </body>
</html>
