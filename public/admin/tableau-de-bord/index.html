<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Control Center | Workcrute</title><link rel="stylesheet" href="../../admin-system.css"></head><body class="admin-body" data-admin-page="dashboard"><template data-admin-content><header class="adm-head"><div><span class="adm-kicker">Fondation sécurisée</span><h1>Workcrute Control Center</h1><p>Supervision réelle de la plateforme et de la sécurité administrative.</p></div><a class="adm-button secondary" href="/admin/securite/">Contrôler la sécurité</a></header><section class="adm-grid adm-stats" data-dashboard-stats><div class="adm-card adm-stat"><span>Utilisateurs</span><strong>—</strong></div><div class="adm-card adm-stat"><span>Candidats</span><strong>—</strong></div><div class="adm-card adm-stat"><span>Recruteurs</span><strong>—</strong></div><div class="adm-card adm-stat"><span>Offres actives</span><strong>—</strong></div></section><section class="adm-grid adm-cols" style="margin-top:18px"><article class="adm-card"><h2>État du Control Center</h2><div class="adm-health"><i class="adm-dot"></i><strong>Session admin isolée</strong></div><ul class="adm-list"><li>Authentification successive à deux niveaux</li><li>Expiration inactive : 30 minutes · expiration absolue : 8 heures</li><li>Cookies HttpOnly, Secure et SameSite Strict</li><li>Rate limit persistant et audit de sécurité</li></ul></article><article class="adm-card"><h2>Prochaine étape</h2><p>La fondation sécurité est active. Les modules CRUD restent volontairement verrouillés jusqu’à validation complète de cette base.</p><a class="adm-button primary" href="/admin/securite/">Ouvrir Sécurité</a></article></section></template><script src="../../admin-layout.js"></script><script src="../../admin-i18n.js"></script><script src="../../admin-control-center.js"></script><script>document.addEventListener("admin:ready",async()=>{try{const d=await adminApi("/api/admin/stats"),v=[d.stats.users,d.stats.candidates,d.stats.recruiters,d.stats.active_jobs];document.querySelectorAll("[data-dashboard-stats] strong").forEach((n,i)=>n.textContent=v[i]??0)}catch(e){document.querySelector("[data-dashboard-stats]").innerHTML=`<div class="adm-error">${e.message}</div>`}})</script></body></html>
