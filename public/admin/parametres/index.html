<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Paramètres | Workcrute</title><link rel="stylesheet" href="../../admin-system.css"></head><body class="admin-body" data-admin-page="settings"><template data-admin-content>
<header class="adm-head"><h1 data-q="settings">Paramètres</h1></header>
<section class="adm-v2-identity"><h2 data-q="questions">Questions des postulants</h2><form data-question-form>
<input type="hidden" name="id">
<label><span data-q="french">Libellé français</span><input name="label_fr" required maxlength="500" lang="fr" dir="ltr"></label>
<label><span data-q="english">Libellé anglais</span><input name="label_en" required maxlength="500" lang="en" dir="ltr"></label>
<label><span data-q="arabic">Libellé arabe</span><input name="label_ar" required maxlength="500" lang="ar" dir="rtl"></label>
<label><span data-q="type">Type</span><select name="type"><option value="text" data-q="text">Texte</option><option value="textarea" data-q="textarea">Texte long</option><option value="number" data-q="number">Nombre</option><option value="checkbox" data-q="checkbox">Case à cocher</option></select></label>
<label><span data-q="order">Ordre</span><input name="position" type="number" min="0" max="1000" value="0" required></label>
<label class="adm-check"><input type="checkbox" name="required"><span data-q="required">Obligatoire</span></label>
<label class="adm-check"><input type="checkbox" name="active" checked><span data-q="active">Active</span></label>
<div class="adm-actions"><button class="adm-button primary" type="submit" data-q="save">Enregistrer</button><button class="adm-button" type="button" data-question-reset data-q="new">Nouvelle question</button></div>
<p data-question-error role="alert"></p></form></section><section><div data-question-list></div></section>
</template><script src="../../admin-layout.js"></script><script src="../../admin-i18n.js"></script><script src="../../admin-control-center.js"></script><script src="../../admin-v2-questions.js"></script></body></html>
