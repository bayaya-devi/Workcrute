<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Emails administratifs | Workcrute</title><link rel="stylesheet" href="../../admin-system.css"></head><body class="admin-body" data-admin-page="settings"><template data-admin-content>
<header class="adm-head"><div><span class="adm-kicker" data-email-i18n="kicker">Paramètres</span><h1 data-email-i18n="title">Emails administratifs</h1><p data-email-i18n="subtitle">Configurez le destinataire, les événements et les récapitulatifs joints.</p></div></header>
<div class="adm-grid adm-security-grid"><section class="adm-card"><h2 data-email-i18n="recipient">Adresse principale</h2><p><span data-email-i18n="current">Adresse actuelle :</span> <strong data-email-current>—</strong> <span class="adm-pill" data-email-verified>—</span></p><form class="adm-form" data-email-request><label class="adm-field"><span data-email-i18n="newEmail">Nouvelle adresse</span><input class="adm-input" type="email" name="email" required autocomplete="email"></label><label class="adm-field"><span data-email-i18n="secret2">Secret niveau 2</span><input class="adm-input" type="password" name="secret2" required autocomplete="current-password"></label><button class="adm-button primary" type="submit" data-email-i18n="verify">Envoyer le code de vérification</button></form><form class="adm-form" data-email-confirm hidden><label class="adm-field"><span data-email-i18n="code">Code reçu par email</span><input class="adm-input" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" name="code" required autocomplete="one-time-code"></label><button class="adm-button primary" type="submit" data-email-i18n="confirm">Confirmer l’adresse</button></form><p class="adm-status" role="status" aria-live="polite" data-email-address-status></p></section>
<section class="adm-card"><h2 data-email-i18n="delivery">Livraison</h2><form class="adm-form" data-email-settings><label class="adm-field"><span data-email-i18n="attachment">Pièce jointe récapitulative</span><select class="adm-input" name="attachmentMode"><option value="none">Aucune</option><option value="pdf">PDF (défaut)</option><option value="csv">CSV</option><option value="both">PDF + CSV</option></select></label><fieldset class="adm-email-events"><legend data-email-i18n="events">Emails actifs</legend><label><input type="checkbox" name="newCandidate"> <span data-email-i18n="newCandidate">Nouveau candidat</span></label><label><input type="checkbox" name="newRecruiter"> <span data-email-i18n="newRecruiter">Nouveau recruteur</span></label><label><input type="checkbox" name="newJob"> <span data-email-i18n="newJob">Nouvelle offre</span></label><label><input type="checkbox" name="newApplication"> <span data-email-i18n="newApplication">Nouvelle candidature</span></label><label><input type="checkbox" name="criticalError"> <span data-email-i18n="criticalError">Erreur critique</span></label><label><input type="checkbox" name="suspiciousAdminLogin"> <span data-email-i18n="suspicious">Connexion admin suspecte</span></label></fieldset><div class="adm-actions"><button class="adm-button primary" type="submit" data-email-i18n="save">Enregistrer</button><button class="adm-button secondary" type="button" data-email-test data-email-i18n="test">Envoyer un email de test</button></div></form><p class="adm-status" role="status" aria-live="polite" data-email-settings-status></p><p class="adm-email-note" data-email-i18n="privacy">Les CV originaux ne sont jamais joints. Aucun mot de passe, hash, token, session, OTP ou secret n’est inclus.</p></section></div>
<section class="adm-card adm-email-history"><div class="adm-email-history-head"><div><h2 data-email-i18n="history">Historique de livraison</h2><p data-email-i18n="historyHelp">Les échecs sont réessayés automatiquement.</p></div><button class="adm-button secondary" type="button" data-email-refresh data-email-i18n="refresh">Actualiser</button></div><div class="adm-table-wrap"><table class="adm-table"><thead><tr><th data-email-i18n="date">Date</th><th data-email-i18n="event">Événement</th><th data-email-i18n="recipientShort">Destinataire</th><th data-email-i18n="status">Statut</th><th data-email-i18n="attempts">Tentatives</th><th data-email-i18n="action">Action</th></tr></thead><tbody data-email-outbox><tr><td colspan="6" class="adm-loading">Chargement…</td></tr></tbody></table></div></section>
</template><script src="../../admin-layout.js"></script><script src="../../admin-i18n.js"></script><script src="../../admin-control-center.js"></script><script src="../../admin-email-settings.js"></script></body></html>
