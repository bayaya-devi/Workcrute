<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Notifications admin | Workcrute</title><link rel="stylesheet" href="../../admin-system.css"></head><body class="admin-body" data-admin-page="notifications"><template data-admin-content><header class="adm-head"><div><span class="adm-kicker">Sécurité & système</span><h1>Notifications administrateur</h1><p>Alertes réelles générées par le Control Center.</p></div></header><section class="adm-card"><ul class="adm-list" data-notifications><li class="adm-loading">Chargement des notifications…</li></ul></section></template><script src="../../admin-layout.js"></script><script src="../../admin-i18n.js"></script><script src="../../admin-control-center.js"></script><script>document.addEventListener("admin:ready",async()=>{const n=document.querySelector("[data-notifications]");try{const d=await adminApi("/api/admin/notifications");n.replaceChildren(...(d.items.length?d.items.map(x=>{const l=document.createElement("li"),t=document.createElement("strong"),p=document.createElement("p"),m=document.createElement("div"),s=document.createElement("span");t.textContent=x.title;p.textContent=x.body;m.className="adm-meta";s.className=`adm-pill ${x.severity}`;s.textContent=x.severity;m.append(s,document.createTextNode(new Date(x.created_at).toLocaleString()));l.append(t,p,m);return l}):[Object.assign(document.createElement("li"),{className:"adm-empty",textContent:"Aucune notification administrative."})]))}catch(e){n.innerHTML=`<li class="adm-error">${e.message}</li>`}})</script></body></html>
