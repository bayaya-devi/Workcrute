<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Employés | Workcrute</title><link rel="stylesheet" href="../../admin-system.css"></head>
<body class="admin-body" data-admin-page="employees"><template data-admin-content>
  <header class="adm-head"><div><span class="adm-kicker">Comptes Workcrute V2</span><h1>Employés</h1><p>Créez et gérez les accès des employés. Aucun employé ne peut s’inscrire lui-même.</p></div><button class="adm-button primary" type="button" data-employee-create>Créer un employé</button></header>
  <section class="adm-card adm-v2-toolbar"><form data-employee-filters><label><span>Rechercher</span><input name="q" placeholder="Nom, e-mail ou fonction"></label><label><span>Statut</span><select name="status"><option value="">Tous</option><option value="active">Actif</option><option value="disabled">Désactivé</option></select></label><button class="adm-button primary">Filtrer</button></form></section>
  <section class="adm-card adm-v2-list"><div class="adm-list-head"><p data-employee-count></p></div><div data-employee-content><div class="adm-loading">Chargement…</div></div></section>
  <dialog class="adm-dialog" data-employee-dialog><div class="adm-dialog-shell"><header><div><span class="adm-kicker">Compte employé</span><h2 data-employee-dialog-title></h2></div><button class="adm-icon-btn" type="button" data-employee-close aria-label="Fermer">×</button></header><form class="adm-dialog-body adm-employee-form" data-employee-form novalidate>
    <input type="hidden" name="id"><div class="adm-form-grid"><label>Prénom *<input name="firstName" required maxlength="100"></label><label>Nom *<input name="lastName" required maxlength="100"></label><label>Fonction *<input name="jobTitle" required maxlength="160"></label><label>Service<input name="department" maxlength="120"></label><label>E-mail<input name="email" type="email" maxlength="254"></label><label>Téléphone<input name="phone" maxlength="40"></label><label>Date d’entrée<input name="hireDate" type="date"></label><label>Langue<select name="language"><option value="fr">Français</option><option value="en">English</option><option value="ar">العربية</option></select></label></div>
    <label>Mot de passe <span data-password-hint>*</span><input name="password" type="password" maxlength="256" autocomplete="new-password"><small>Libre, même simple. Il sera hashé et ne sera jamais réaffiché.</small></label>
    <div class="adm-form-error" data-employee-error></div><footer class="adm-actions"><button class="adm-button" type="button" data-employee-close>Annuler</button><button class="adm-button primary" type="submit">Enregistrer</button></footer>
  </form></div></dialog>
  <div class="adm-toast" data-employee-toast hidden></div>
</template><script src="../../admin-layout.js"></script><script src="../../admin-i18n.js"></script><script src="../../admin-control-center.js"></script><script src="../../admin-v2-employees.js"></script></body></html>
