<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Employés | Workcrute</title><link rel="stylesheet" href="../../admin-system.css"></head>
<body class="admin-body" data-admin-page="employees"><template data-admin-content>
  <header class="adm-head"><div><span class="adm-kicker">Workcrute V2</span><h1 data-adm-i18n="v2_employees_title">Employés</h1><p data-adm-i18n="v2_employees_copy">Créez et gérez les accès des employés. Aucun employé ne peut s’inscrire lui-même.</p></div><button class="adm-button primary" type="button" data-employee-create data-adm-i18n="v2_create_employee">Créer un employé</button></header>
  <section class="adm-card adm-v2-toolbar"><form data-employee-filters><label><span data-adm-i18n="v2_search">Rechercher</span><input name="q" data-adm-i18n-placeholder="v2_employee_search" placeholder="Nom, e-mail ou fonction"></label><label><span data-adm-i18n="v2_status">Statut</span><select name="status"><option value="" data-adm-i18n="v2_all">Tous</option><option value="active" data-adm-i18n="v2_active">Actif</option><option value="disabled" data-adm-i18n="v2_disabled">Désactivé</option></select></label><button class="adm-button primary" data-adm-i18n="v2_filter">Filtrer</button></form></section>
  <section class="adm-card adm-v2-list"><div class="adm-list-head"><p data-employee-count></p></div><div data-employee-content><div class="adm-loading" data-adm-i18n="loading">Chargement…</div></div></section>
  <dialog class="adm-dialog" data-employee-dialog><div class="adm-dialog-shell"><header><div><span class="adm-kicker">Workcrute V2</span><h2 data-employee-dialog-title></h2></div><button class="adm-icon-btn" type="button" data-employee-close aria-label="Fermer" data-adm-i18n-aria="close">×</button></header><form class="adm-dialog-body adm-employee-form" data-employee-form novalidate>
    <input type="hidden" name="id"><div class="adm-form-grid"><label><span data-adm-i18n="v2_first_name">Prénom</span> *<input name="firstName" required maxlength="100"></label><label><span data-adm-i18n="v2_last_name">Nom</span> *<input name="lastName" required maxlength="100"></label><label><span data-adm-i18n="v2_job_title">Fonction</span> *<input name="jobTitle" required maxlength="160"></label><label><span data-adm-i18n="v2_department">Service</span><input name="department" maxlength="120"></label><label><span data-adm-i18n="v2_email">E-mail</span><input name="email" type="email" maxlength="254"></label><label><span data-adm-i18n="v2_phone">Téléphone</span><input name="phone" maxlength="40"></label><label><span data-adm-i18n="v2_hire_date">Date d’entrée</span><input name="hireDate" type="date"></label><label><span data-adm-i18n="v2_language">Langue</span><select name="language"><option value="fr">Français</option><option value="en">English</option><option value="ar">العربية</option></select></label></div>
    <label><span data-adm-i18n="v2_password">Mot de passe</span> <span data-password-hint>*</span><input name="password" type="password" maxlength="256" autocomplete="new-password"><small data-dynamic-password-help></small></label>
    <div class="adm-form-error" data-employee-error></div><footer class="adm-actions"><button class="adm-button" type="button" data-employee-close data-adm-i18n="v2_cancel">Annuler</button><button class="adm-button primary" type="submit" data-adm-i18n="v2_save">Enregistrer</button></footer>
  </form></div></dialog>
  <div class="adm-toast" data-employee-toast hidden></div>
</template><script src="../../admin-layout.js"></script><script src="../../admin-i18n.js"></script><script src="../../admin-control-center.js"></script><script src="../../admin-v2-employees.js"></script></body></html>
