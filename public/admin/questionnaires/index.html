<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Questionnaires | Workcrute</title><link rel="stylesheet" href="../../admin-system.css"></head>
<body class="admin-body" data-admin-page="questionnaires"><template data-admin-content>
<header class="adm-head"><div><span class="adm-kicker" data-q-i18n="builder">Questionnaire Builder</span><h1 data-q-title>Questionnaires</h1><p data-q-i18n="subtitle">Créez des modèles multilingues, conditionnels et scorés.</p></div><div class="adm-actions"><button class="adm-button secondary" type="button" data-back hidden>Retour</button><button class="adm-button primary" type="button" data-create>Créer un modèle</button></div></header>
<div class="adm-toast" data-q-toast role="status" aria-live="polite" hidden></div>
<section data-q-list><div class="adm-card adm-questionnaire-list"><div class="adm-loading" data-q-i18n="loading">Chargement…</div></div></section>
<section data-q-builder hidden>
  <form class="adm-card adm-template-form" data-template-form>
    <div class="adm-section-head"><div><h2 data-q-i18n="settings">Paramètres du modèle</h2><p data-q-i18n="settingsHelp">Publication et disponibilité pour les recruteurs.</p></div><button class="adm-button primary" type="submit" data-save-template>Enregistrer</button></div>
    <div class="adm-form-grid adm-template-grid">
      <label class="adm-field"><span data-q-i18n="name">Nom</span><input class="adm-input" name="name" maxlength="160" required></label>
      <label class="adm-field"><span data-q-i18n="kind">Modèle</span><select class="adm-input" name="templateKind"><option value="general">Général</option><option value="sales">Commercial</option><option value="it">Informatique</option><option value="logistics">Logistique</option><option value="management">Management</option><option value="custom">Personnalisé</option></select></label>
      <label class="adm-field adm-span-all"><span data-q-i18n="description">Description</span><textarea class="adm-input" name="description" maxlength="1000"></textarea></label>
      <label class="adm-field"><span data-q-i18n="status">Statut</span><select class="adm-input" name="status"><option value="draft">Brouillon</option><option value="active">Actif</option><option value="archived">Archivé</option></select></label>
      <label class="adm-check"><input type="checkbox" name="recruiterAvailable"><span data-q-i18n="recruiterAvailable">Autoriser les recruteurs à utiliser ce modèle</span></label>
    </div>
  </form>
  <section class="adm-card adm-builder-card"><div class="adm-section-head"><div><h2 data-q-i18n="questions">Questions</h2><p data-q-i18n="dragHelp">Glissez-déposez ou utilisez les flèches pour réordonner.</p></div><button class="adm-button primary" type="button" data-add-question>Ajouter une question</button></div><div class="adm-question-list" data-question-list></div></section>
</section>
<dialog class="adm-dialog adm-question-dialog" data-template-dialog><form method="dialog" class="adm-dialog-shell" data-template-create><header><div><span class="adm-kicker">Workcrute</span><h2 data-q-i18n="createTemplate">Créer un modèle</h2></div><button class="adm-icon-btn" value="cancel" aria-label="Fermer">×</button></header><div class="adm-dialog-body adm-form-grid"><label class="adm-field"><span data-q-i18n="name">Nom</span><input class="adm-input" name="name" maxlength="160" required></label><label class="adm-field"><span data-q-i18n="kind">Modèle</span><select class="adm-input" name="templateKind"><option value="custom">Personnalisé</option><option value="general">Général</option><option value="sales">Commercial</option><option value="it">Informatique</option><option value="logistics">Logistique</option><option value="management">Management</option></select></label><label class="adm-field adm-span-all"><span data-q-i18n="description">Description</span><textarea class="adm-input" name="description"></textarea></label></div><footer class="adm-actions"><button class="adm-button secondary" value="cancel">Annuler</button><button class="adm-button primary" value="default" data-submit-create>Créer</button></footer></form></dialog>
<dialog class="adm-dialog adm-question-dialog" data-question-dialog><form class="adm-dialog-shell" data-question-form><header><div><span class="adm-kicker">Question</span><h2 data-question-dialog-title>Ajouter une question</h2></div><button class="adm-icon-btn" type="button" data-close-question aria-label="Fermer">×</button></header><div class="adm-dialog-body" data-question-fields></div><footer class="adm-actions"><button class="adm-button secondary" type="button" data-close-question>Annuler</button><button class="adm-button primary" type="submit" data-save-question>Enregistrer</button></footer></form></dialog>
</template><script src="../../admin-layout.js"></script><script src="../../admin-i18n.js"></script><script src="../../admin-control-center.js"></script><script src="../../admin-questionnaire-builder.js"></script></body></html>
