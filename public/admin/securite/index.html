<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sécurité | Workcrute Control Center</title><link rel="stylesheet" href="../../admin-system.css"></head><body class="admin-body" data-admin-page="security"><template data-admin-content><header class="adm-head"><div><span class="adm-kicker">Administration</span><h1>Sécurité du Control Center</h1><p>Secrets, messagerie de validation et état de session.</p></div></header><div class="adm-grid adm-security-grid"><article class="adm-card"><h2>Email administratif principal</h2><p data-email-state>Chargement de la configuration…</p><form class="adm-form" data-email-request><label class="adm-field"><span>Nouvelle adresse email</span><input class="adm-input" type="email" name="email" autocomplete="email" maxlength="254" required></label><label class="adm-field"><span>Secret de niveau 2</span><input class="adm-input" type="password" name="secret2" autocomplete="current-password" maxlength="200" required></label><button class="adm-button primary" type="submit">Envoyer le code</button><p class="adm-status" data-status aria-live="polite"></p></form><form class="adm-form" data-email-confirm hidden><label class="adm-field"><span>Code reçu par email</span><input class="adm-input" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></label><button class="adm-button primary" type="submit">Vérifier et enregistrer</button><p class="adm-status" data-status aria-live="polite"></p></form><div class="adm-actions" style="margin-top:14px"><button class="adm-button secondary" data-email-test>Envoyer un email test</button></div></article><article class="adm-card"><h2>Session actuelle</h2><ul class="adm-list"><li><strong>Cookie</strong><div class="adm-meta">HttpOnly · Secure · SameSite Strict</div></li><li><strong>Expiration inactive</strong><div class="adm-meta" data-idle-expiry>—</div></li><li><strong>Expiration absolue</strong><div class="adm-meta" data-session-expiry>—</div></li><li><strong>Permissions</strong><div class="adm-meta">Contrôle serveur admin dédié</div></li></ul></article></div><section class="adm-grid adm-security-grid" style="margin-top:18px"><article class="adm-card"><h2>Modifier le secret niveau 1</h2><form class="adm-form" data-secret-form data-level="1"><label class="adm-field"><span>Secret actuel</span><input class="adm-input" type="password" name="currentSecret" autocomplete="current-password" required></label><label class="adm-field"><span>Nouveau secret</span><input class="adm-input" type="password" name="newSecret" autocomplete="new-password" minlength="14" required></label><label class="adm-field"><span>Confirmation</span><input class="adm-input" type="password" name="confirmSecret" autocomplete="new-password" minlength="14" required></label><button class="adm-button primary" type="submit">Demander la modification</button><p class="adm-status" data-status aria-live="polite"></p></form><form class="adm-form" data-secret-confirm data-level="1" hidden><label class="adm-field"><span>Code email à 6 chiffres</span><input class="adm-input" name="code" inputmode="numeric" maxlength="6" required></label><button class="adm-button primary" type="submit">Confirmer le changement</button><p class="adm-status" data-status></p></form></article><article class="adm-card"><h2>Modifier le secret niveau 2</h2><form class="adm-form" data-secret-form data-level="2"><label class="adm-field"><span>Secret actuel</span><input class="adm-input" type="password" name="currentSecret" autocomplete="current-password" required></label><label class="adm-field"><span>Nouveau secret</span><input class="adm-input" type="password" name="newSecret" autocomplete="new-password" minlength="14" required></label><label class="adm-field"><span>Confirmation</span><input class="adm-input" type="password" name="confirmSecret" autocomplete="new-password" minlength="14" required></label><button class="adm-button primary" type="submit">Demander la modification</button><p class="adm-status" data-status aria-live="polite"></p></form><form class="adm-form" data-secret-confirm data-level="2" hidden><label class="adm-field"><span>Code email à 6 chiffres</span><input class="adm-input" name="code" inputmode="numeric" maxlength="6" required></label><button class="adm-button primary" type="submit">Confirmer le changement</button><p class="adm-status" data-status></p></form></article></section></template><script src="../../admin-layout.js"></script><script src="../../admin-i18n.js"></script><script src="../../admin-control-center.js"></script><script src="../../admin-security.js"></script></body></html>
