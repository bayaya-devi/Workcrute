<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Centre d’erreurs | Workcrute</title><link rel="stylesheet" href="../../admin-system.css"></head><body class="admin-body" data-admin-page="errors"><template data-admin-content>
<header class="adm-head"><div><span class="adm-kicker" data-err-i18n="kicker">Supervision</span><h1 data-err-i18n="title">Centre d’erreurs</h1><p data-err-i18n="subtitle">Incidents centralisés, références de requête et suivi de résolution.</p></div></header>
<section class="adm-grid adm-stats adm-error-stats"><article class="adm-card adm-stat"><span data-err-i18n="today">Aujourd’hui</span><strong data-stat="today">—</strong></article><article class="adm-card adm-stat"><span data-err-i18n="critical">Critiques</span><strong data-stat="critical">—</strong></article><article class="adm-card adm-stat"><span>Email</span><strong data-stat="email">—</strong></article><article class="adm-card adm-stat"><span>Upload</span><strong data-stat="upload">—</strong></article><article class="adm-card adm-stat"><span>IA</span><strong data-stat="ai">—</strong></article><article class="adm-card adm-stat"><span>API</span><strong data-stat="api">—</strong></article></section>
<section class="adm-card adm-error-center"><form class="adm-business-filters" data-error-filters><label class="adm-field"><span data-err-i18n="search">Recherche</span><input class="adm-input" name="q" placeholder="Code, route, Request ID…"></label><label class="adm-field"><span data-err-i18n="service">Service</span><select class="adm-input" name="service"><option value="">Tous</option><option>api</option><option>auth</option><option>database</option><option>email</option><option>upload</option><option>ai</option><option>frontend</option></select></label><label class="adm-field"><span data-err-i18n="severity">Sévérité</span><select class="adm-input" name="severity"><option value="">Toutes</option><option>info</option><option>warning</option><option>error</option><option>critical</option></select></label><label class="adm-field"><span data-err-i18n="status">Statut</span><select class="adm-input" name="status"><option value="">Tous</option><option value="new">Nouvelle</option><option value="in_progress">En cours</option><option value="resolved">Résolue</option><option value="ignored">Ignorée</option></select></label><button class="adm-button primary" type="submit" data-err-i18n="filter">Filtrer</button></form>
<p class="adm-status" data-error-status role="status" aria-live="polite"></p><div class="adm-table-wrap"><table class="adm-table adm-error-table"><thead><tr><th data-err-i18n="date">Date</th><th data-err-i18n="severity">Sévérité</th><th data-err-i18n="service">Service</th><th>Code</th><th data-err-i18n="message">Message</th><th data-err-i18n="user">Utilisateur</th><th data-err-i18n="route">Route</th><th>Request ID</th><th data-err-i18n="status">Statut</th><th data-err-i18n="action">Action</th></tr></thead><tbody data-error-rows><tr><td colspan="10" class="adm-loading">Chargement…</td></tr></tbody></table></div></section>
<dialog class="adm-error-dialog" data-error-dialog><form method="dialog" class="adm-card adm-form" data-error-form><div><h2 data-err-i18n="manage">Gérer l’erreur</h2><p class="wc-system-reference" data-error-reference></p></div><label class="adm-field"><span data-err-i18n="status">Statut</span><select class="adm-input" name="status"><option value="new">Nouvelle</option><option value="in_progress">En cours</option><option value="resolved">Résolue</option><option value="ignored">Ignorée</option></select></label><label class="adm-field"><span data-err-i18n="note">Note administrateur</span><textarea class="adm-input" name="note" maxlength="2000" rows="5"></textarea></label><div class="adm-actions"><button class="adm-button secondary" value="cancel" type="button" data-error-close data-err-i18n="cancel">Annuler</button><button class="adm-button primary" value="save" type="submit" data-err-i18n="save">Enregistrer</button></div></form></dialog>
</template><script src="../../admin-layout.js"></script><script src="../../admin-i18n.js"></script><script src="../../admin-control-center.js"></script><script src="../../admin-errors.js"></script></body></html>
