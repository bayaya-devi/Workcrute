<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Chatbot / FAQ | Workcrute</title><link rel="stylesheet" href="../../admin-system.css"></head><body class="admin-body" data-admin-page="chatbot"><template data-admin-content>
<header class="adm-head"><div><span class="adm-kicker">Assistant Workcrute</span><h1>FAQ & analytics chatbot</h1><p>Base multilingue, questions non comprises et qualité des réponses.</p></div><button class="adm-button primary" data-new-faq>Ajouter une FAQ</button></header>
<div class="adm-tabs" role="tablist"><button class="adm-filter" aria-pressed="true" data-chat-tab="faq">FAQ</button><button class="adm-filter" aria-pressed="false" data-chat-tab="analytics">Analytics</button><button class="adm-filter" aria-pressed="false" data-chat-tab="unknown">Questions non comprises</button></div>
<section data-faq-panel><form class="adm-card adm-business-toolbar adm-business-filters" data-faq-filters><input class="adm-input" name="q" placeholder="Rechercher"><select class="adm-input" name="category"><option value="">Toutes les catégories</option></select><select class="adm-input" name="active"><option value="">Tous les statuts</option><option value="1">Actif</option><option value="0">Inactif</option></select><button class="adm-button primary">Filtrer</button></form><div class="adm-card adm-business-list" data-faq-list><div class="adm-loading">Chargement…</div></div></section>
<section data-analytics-panel hidden><div class="adm-dashboard-stats" data-chat-stats></div><div class="adm-grid adm-grid-2"><article class="adm-card adm-builder-card"><h2>Questions les plus posées</h2><div data-top-questions></div></article><article class="adm-card adm-builder-card"><h2>Catégories et langues</h2><div data-breakdown></div></article></div></section>
<section data-unknown-panel hidden><div class="adm-card adm-business-list" data-unknown-list></div></section>
<dialog class="adm-dialog adm-question-dialog" data-faq-dialog><form class="adm-dialog-shell" data-faq-form><header><div><span class="adm-kicker">FAQ</span><h2 data-faq-form-title>Ajouter</h2></div><button class="adm-icon-btn" type="button" data-close-faq>×</button></header><div class="adm-dialog-body"><input type="hidden" name="id"><div class="adm-form-grid"><label class="adm-field"><span>Catégorie</span><select class="adm-input" name="category" required></select></label><label class="adm-field"><span>Priorité</span><input class="adm-input" type="number" name="priority" min="0" max="999" value="50"></label><label class="adm-check"><input type="checkbox" name="active" checked><span>Actif</span></label></div><div data-faq-languages></div></div><footer class="adm-actions"><button class="adm-button secondary" type="button" data-close-faq>Annuler</button><button class="adm-button primary" type="submit">Enregistrer</button></footer></form></dialog><div class="adm-toast" data-chat-toast hidden></div>
</template><script src="../../admin-layout.js"></script><script src="../../admin-i18n.js"></script><script src="../../admin-control-center.js"></script><script src="../../admin-chatbot.js"></script></body></html>
