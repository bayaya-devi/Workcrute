<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Audit admin | Workcrute</title><link rel="stylesheet" href="../../admin-system.css"></head><body class="admin-body" data-admin-page="activity"><template data-admin-content><header class="adm-head"><div><span class="adm-kicker">Traçabilité</span><h1>Journal d’audit</h1><p>Actions sensibles du Control Center, sans secrets ni codes de validation.</p></div></header><div class="adm-table-wrap"><table class="adm-table"><thead><tr><th>Date</th><th>Action</th><th>Ressource</th><th>Identifiant</th></tr></thead><tbody data-audit><tr><td colspan="4">Chargement…</td></tr></tbody></table></div></template><script src="../../admin-layout.js"></script><script src="../../admin-i18n.js"></script><script src="../../admin-control-center.js"></script><script>document.addEventListener("admin:ready",async()=>{const b=document.querySelector("[data-audit]");try{const d=await adminApi("/api/admin/audit");b.replaceChildren(...(d.items.length?d.items.map(x=>{const r=document.createElement("tr");[new Date(x.created_at).toLocaleString(),x.action,x.resource_type,x.resource_id||"—"].forEach(v=>{const c=document.createElement("td");c.textContent=v;r.append(c)});return r}):[Object.assign(document.createElement("tr"),{innerHTML:'<td colspan="4">Aucune action auditée.</td>'})]))}catch(e){b.innerHTML=`<tr><td colspan="4">${e.message}</td></tr>`}})</script></body></html>
