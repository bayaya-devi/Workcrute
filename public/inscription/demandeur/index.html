<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inscription demandeur | Workcrute</title><link rel="stylesheet" href="../../shared.css"></head><body><header class="topbar"><a class="brand" data-go="/" href="/"><img src="../../assets/logo-workrute.png" alt="Workcrute"></a><a class="home-link" data-go="/" href="/">Accueil</a><div class="top-actions"><select class="language" data-language><option value="fr">Francais</option><option value="ar">Arabe</option><option value="en">English</option></select><a class="button primary" data-go="/connexion" href="/connexion">Me connecter</a></div></header><main class="page"><div class="split"><section><span class="eyebrow">Workcrute</span><h1>Inscription demandeur</h1><p class="form-note">Une plateforme de recrutement simple, claire et securisee.</p></section><section class="panel"><form class="form" data-signup data-role="candidate"><div class="progress"><i></i></div><b data-step-label></b><section class="step"><p>Vos informations personnelles.</p><div class="grid-2"><label class="field">Prenom<input required name="firstName"></label><label class="field">Nom<input required name="lastName"></label></div><label class="field">E-mail<input required type="email" name="email"></label><label class="field">Telephone<input required name="phone" placeholder="+212 6 00 00 00 00"></label><div class="grid-2"><label class="field">Mot de passe<input required type="password" name="password" minlength="8" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}" title="8 caracteres, majuscule, minuscule, chiffre et caractere special"></label><label class="field">Confirmation<input required type="password" name="confirmPassword"></label></div><label class="field">Ville<input required name="city"></label><label class="field">Region<input name="region"></label><label class="field">Disponibilit?<select name="availability"><option value="immediate">Imm?diatement</option><option value="one_month">Dans 1 mois</option><option value="two_months">Dans 2 mois</option><option value="later">Plus tard</option><option value="to_be_confirmed">? pr?ciser</option></select></label><label class="field">Pr?cisez votre date ou p?riode de disponibilit?<input name="availabilityDetail"></label></section><section class="step"><p>Votre domaine professionnel.</p><label class="field">Domaine<select required name="domain"><option value="">Selectionnez</option><option>Informatique et developpement</option><option>Reseaux et cybersecurite</option><option>Commerce</option><option>Vente</option><option>Marketing</option><option>Communication</option><option>Ressources humaines</option><option>Finance</option><option>Comptabilite</option><option>Administration</option><option>Logistique</option><option>Transport</option><option>Industrie</option><option>Batiment</option><option>Sante</option><option>Education</option><option>Hotellerie</option><option>Restauration</option><option>Services</option><option>Artisanat</option><option value="other">Autre</option></select></label><label class="field">Precisez si autre<input name="otherDomain"></label></section><section class="step"><p>Mini-questionnaire.</p><label class="field">Contrat recherche<select required name="contract"><option>CDI</option><option>CDD</option><option>Stage</option><option>Freelance</option></select></label><div class="grid-2"><label class="field">Experience<select name="experience"><option>Debutant</option><option>1 a 3 ans</option><option>3 a 5 ans</option><option>5 ans et plus</option></select></label><label class="field">Mode de travail<select name="workMode"><option>Sur place</option><option>Hybride</option><option>A distance</option></select></label></div><label class="field">Competences<textarea name="skills"></textarea></label></section><section class="step"><p>Documents et presentation.</p><label class="dropzone">CV (PDF, DOC ou DOCX)<input required type="file" name="cv" accept=".pdf,.doc,.docx"></label><label class="dropzone">Lettre de motivation facultative<input type="file" name="letter" accept=".pdf,.doc,.docx"></label><label class="field">Presentez-vous en quelques lignes<textarea name="introduction"></textarea></label></section><p class="error" role="alert"></p><div class="form-actions"><button class="button secondary" type="button" data-back>Precedent</button><button class="button primary" type="button" data-next>Continuer</button><button class="button primary" type="submit">Terminer</button></div><p class="form-note"><a data-go="/connexion" href="/connexion">J'ai deja un compte</a></p></form></section></main><script src="../../local-api.js"></script><script src="i18n-runtime.js"></script><script src="../../client.js"></script></body></html>
